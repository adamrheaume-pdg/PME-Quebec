name: Compiler APK Borne Giga Controle
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'BorneGigaControle/**'
      - '.github/workflows/borne-giga-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Préparer logo Bell223
        run: |
          mkdir -p BorneGigaControle/app/src/main/res/mipmap-xxxhdpi
          mkdir -p BorneGigaControle/app/src/main/res/drawable
          base64 -d BorneGigaControle/app_icon.b64 > BorneGigaControle/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp BorneGigaControle/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png BorneGigaControle/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          cp BorneGigaControle/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png BorneGigaControle/app/src/main/res/drawable/bell223_logo.png
      - name: Compiler APK
        run: gradle -p BorneGigaControle assembleDebug
      - name: Préparer APK
        run: cp BorneGigaControle/app/build/outputs/apk/debug/app-debug.apk Borne-Giga-Controle.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Borne-Giga-Controle-APK
          path: Borne-Giga-Controle.apk
