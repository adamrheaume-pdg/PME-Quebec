name: Compiler Québec 360 Données

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/quebec360data/**'
      - '.github/workflows/build-quebec360data.yml'
  pull_request:
    paths:
      - 'apps/quebec360data/**'
      - '.github/workflows/build-quebec360data.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Corriger contraste et barres système
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps/quebec360data/app/src/main/java/quebec/donnees/q360/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          s = s.replace('CardDefaults.cardColors(containerColor = Color(0xB30A1D4E))', 'CardDefaults.cardColors(containerColor = Color(0xB30A1D4E), contentColor = Color.White)')
          s = s.replace('CardDefaults.cardColors(containerColor = Color(0xC6071B49))', 'CardDefaults.cardColors(containerColor = Color(0xC6071B49), contentColor = Color.White)')
          s = s.replace('CardDefaults.cardColors(containerColor = Color(0x553F5F8F))', 'CardDefaults.cardColors(containerColor = Color(0x553F5F8F), contentColor = Color.White)')
          s = s.replace('CardDefaults.cardColors(containerColor = Color(0xAA061A4A))', 'CardDefaults.cardColors(containerColor = Color(0xAA061A4A), contentColor = Color.White)')
          s = s.replace('Text("QUÉBEC 360", fontSize = 27.sp, fontWeight = FontWeight.Black, letterSpacing = 1.sp)', 'Text("QUÉBEC 360", fontSize = 27.sp, fontWeight = FontWeight.Black, letterSpacing = 1.sp, color = Color.White)')
          s = s.replace('Text(title, fontSize = 16.sp, fontWeight = FontWeight.Black, letterSpacing = 1.sp)', 'Text(title, fontSize = 16.sp, fontWeight = FontWeight.Black, letterSpacing = 1.sp, color = Color.White)')
          s = s.replace('Text("Région affichée", fontWeight = FontWeight.Bold)', 'Text("Région affichée", fontWeight = FontWeight.Bold, color = Color.White)')
          s = s.replace('Text(title, fontWeight = FontWeight.Bold)', 'Text(title, fontWeight = FontWeight.Bold, color = Color.White)')
          s = s.replace('Text(if (loading) "…" else value, fontSize = 28.sp, fontWeight = FontWeight.Black)', 'Text(if (loading) "…" else value, fontSize = 28.sp, fontWeight = FontWeight.Black, color = Color.White)')
          s = s.replace('Text(module.title, fontWeight = FontWeight.Black, fontSize = 16.sp)', 'Text(module.title, fontWeight = FontWeight.Black, fontSize = 16.sp, color = Color.White)')
          s = s.replace('Text("Québec 360 – Données", fontSize = 20.sp, fontWeight = FontWeight.Black)', 'Text("Québec 360 – Données", fontSize = 20.sp, fontWeight = FontWeight.Black, color = Color.White)')
          s = s.replace('modifier = Modifier.fillMaxSize(),\n                contentPadding = PaddingValues(start = 16.dp, end = 16.dp, top = 20.dp, bottom = 90.dp),', 'modifier = Modifier.fillMaxSize().systemBarsPadding(),\n                contentPadding = PaddingValues(start = 16.dp, end = 16.dp, top = 12.dp, bottom = 24.dp),')
          p.write_text(s, encoding='utf-8')

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler APK debug
        run: gradle -p apps/quebec360data :app:assembleDebug --stacktrace

      - name: Renommer APK
        run: cp apps/quebec360data/app/build/outputs/apk/debug/app-debug.apk Quebec-360-Donnees-v1.2-Barres-Systeme.apk

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Quebec-360-Donnees-v1.2-Barres-Systeme
          path: Quebec-360-Donnees-v1.2-Barres-Systeme.apk
          retention-days: 30
