name: Compiler Essence Lanaudiere APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'EssenceLanaudiere/**'
      - '.github/workflows/build-essence-lanaudiere.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Ajouter rayon 60 km
        shell: bash
        run: |
          set -euo pipefail
          FILE="EssenceLanaudiere/app/src/main/java/quebec/lanaudiere/essence/MainActivity.java"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("EssenceLanaudiere/app/src/main/java/quebec/lanaudiere/essence/MainActivity.java")
          s = p.read_text(encoding="utf-8")
          old_spinner = 'radiusSpinner=spinner(new String[]{"5 km","10 km","20 km","30 km"}); radiusSpinner.setSelection(3);'
          new_spinner = 'radiusSpinner=spinner(new String[]{"5 km","10 km","20 km","30 km","60 km"}); radiusSpinner.setSelection(3);'
          old_values = 'int radius=new int[]{5,10,20,30}[radiusSpinner.getSelectedItemPosition()];'
          new_values = 'int radius=new int[]{5,10,20,30,60}[radiusSpinner.getSelectedItemPosition()];'
          if old_spinner not in s:
              raise SystemExit("Sélecteur de rayon introuvable")
          if old_values not in s:
              raise SystemExit("Tableau des rayons introuvable")
          s = s.replace(old_spinner, new_spinner, 1).replace(old_values, new_values, 1)
          p.write_text(s, encoding="utf-8")
          PY
          grep -F '60 km' "$FILE"
          grep -F '5,10,20,30,60' "$FILE"

      - name: Integrer le logo PNG transparent
        shell: bash
        run: |
          set -euo pipefail
          LOGO_B64="EssenceLanaudiere/logo/essence_quebec_logo.b64"
          RES="EssenceLanaudiere/app/src/main/res"
          base64 --decode "$LOGO_B64" > "$RES/drawable/essence_quebec_logo.png"
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "$RES/$d"
            cp "$RES/drawable/essence_quebec_logo.png" "$RES/$d/ic_launcher.png"
          done
          file "$RES/drawable/essence_quebec_logo.png"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compiler APK debug
        run: gradle -p EssenceLanaudiere :app:assembleDebug --stacktrace

      - name: Renommer APK
        run: cp EssenceLanaudiere/app/build/outputs/apk/debug/app-debug.apk Essence-Quebec.apk

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Essence-Lanaudiere-APK
          path: Essence-Quebec.apk
          retention-days: 30
