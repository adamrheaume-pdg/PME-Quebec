name: Compiler APK OUI Quebec

on:
  workflow_dispatch:
  push:
    paths:
      - 'oui-quebec/**'
      - '.github/workflows/oui-quebec-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compiler OUI Quebec
        run: |
          cd oui-quebec
          gradle :app:assembleDebug --stacktrace

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: OUI-Quebec-APK
          path: oui-quebec/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
