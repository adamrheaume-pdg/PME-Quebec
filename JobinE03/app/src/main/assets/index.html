<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#07130e;color:#f4fff7;font-family:sans-serif}.top{padding:20px;background:#0d2118}.brand{font-size:28px;font-weight:800;color:#a8f028}.tabs{display:flex;gap:8px;padding:12px;position:sticky;top:0;background:#07130e}.tabs button,.btn{background:#a8f028;color:#07130e;border:0;border-radius:16px;padding:12px 16px;font-weight:700}.page{display:none;padding:14px}.page.on{display:block}.card{background:#0d2118;border:1px solid #24503a;border-radius:18px;padding:16px;margin:10px 0}.muted{color:#9cb2a5}.grow{font-size:90px;text-align:center}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}input,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid #24503a;background:#123125;color:white;margin:6px 0;box-sizing:border-box}</style></head><body><div class="top"><div class="brand">JobinE</div><div>Le recrutement qui pousse 🌱</div></div><div class="tabs"><button onclick="go('jobs')">Emplois</button><button onclick="go('feed')">Fil</button><button onclick="go('garden')">Progression</button><button onclick="go('profile')">Profil</button></div><section id="jobs" class="page on"><h2>Offres près de toi</h2><div id="jobsList"></div><button class="btn" onclick="newJob()">Ajouter une offre test</button></section><section id="feed" class="page"><h2>Fil professionnel</h2><textarea id="postText" placeholder="Écris une publication"></textarea><button class="btn" onclick="post()">Publier</button><div id="feedList"></div></section><section id="garden" class="page"><h2>Ta progression</h2><div class="grow" id="plant">🌱</div><div class="card"><b id="pts">0 points</b><div class="muted">Postule et publie pour faire pousser ton haricot.</div></div></section><section id="profile" class="page"><h2>Profil</h2><div class="card"><input id="name" placeholder="Nom"><input id="title" placeholder="Métier"><input id="city" placeholder="Ville"><button class="btn" onclick="saveProfile()">Enregistrer</button></div></section><script>const D={jobs:[{id:1,t:'Électricien industriel',c:'Industries Québec',city:'Joliette',s:'38–45 $/h'},{id:2,t:'Technicien instrumentation',c:'Automatisation Lanaudière',city:'Rawdon',s:'40–48 $/h'}],feed:[{text:'Projet terminé avec succès ⚡'}],points:0,profile:{name:'',title:'',city:''}};let S=JSON.parse(localStorage.getItem('jobine03')||'null')||D;function save(){localStorage.setItem('jobine03',JSON.stringify(S))}function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');render()}function render(){jobsList.innerHTML=S.jobs.map(j=>`<div class=card><b>${j.t}</b><div>${j.c} • ${j.city}</div><div class=muted>${j.s}</div><button class=btn onclick="apply(${j.id})">Postuler</button></div>`).join('');feedList.innerHTML=S.feed.map(f=>`<div class=card>${f.text}</div>`).join('');pts.textContent=S.points+' points';plant.textContent=S.points>120?'🌳':S.points>60?'🌿':'🌱';name.value=S.profile.name;title.value=S.profile.title;city.value=S.profile.city}function apply(id){S.points+=40;save();render();alert('Candidature enregistrée sur ce téléphone.')}function newJob(){S.jobs.unshift({id:Date.now(),t:'Nouvelle offre',c:'Mon entreprise',city:'Québec',s:'À discuter'});S.points+=10;save();render()}function post(){let v=postText.value.trim();if(!v)return;S.feed.unshift({text:v});postText.value='';S.points+=20;save();render()}function saveProfile(){S.profile={name:name.value,title:title.value,city:city.value};S.points+=10;save();render();alert('Profil enregistré.')}render();</script></body></html>
