name: Compiler Pixel Cast Universal APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "apps/PixelCastUniversal/**"
      - ".github/workflows/build-pixelcast.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compiler APK debug
        working-directory: apps/PixelCastUniversal
        run: gradle assembleDebug
      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelCastUniversal-debug-apk
          path: apps/PixelCastUniversal/app/build/outputs/apk/debug/app-debug.apk
