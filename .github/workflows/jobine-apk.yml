name: Build JobinE APK
on:
  push:
    paths:
      - 'JobinE-source.zip'
      - '.github/workflows/jobine-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract JobinE source
        run: |
          rm -rf JobinE
          unzip -q JobinE-source.zip
      - name: Build debug APK
        working-directory: JobinE
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp JobinE/app/build/outputs/apk/debug/app-debug.apk JobinE-0.1.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JobinE-APK
          path: JobinE-0.1.0-debug.apk
          if-no-files-found: error
