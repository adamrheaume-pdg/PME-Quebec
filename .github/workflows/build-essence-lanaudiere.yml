name: Compiler Essence Lanaudiere APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'EssenceLanaudiere/**'
      - '.github/workflows/build-essence-lanaudiere.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Ajouter rayon 60 km
        shell: bash
        run: |
          set -euo pipefail
          FILE="EssenceLanaudiere/app/src/main/java/quebec/lanaudiere/essence/MainActivity.java"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("EssenceLanaudiere/app/src/main/java/quebec/lanaudiere/essence/MainActivity.java")
          s = p.read_text(encoding="utf-8")
          old_spinner = 'radiusSpinner=spinner(new String[]{"5 km","10 km","20 km","30 km"}); radiusSpinner.setSelection(3);'
          new_spinner = 'radiusSpinner=spinner(new String[]{"5 km","10 km","20 km","30 km","60 km"}); radiusSpinner.setSelection(3);'
          old_values = 'int radius=new int[]{5,10,20,30}[radiusSpinner.getSelectedItemPosition()];'
          new_values = 'int radius=new int[]{5,10,20,30,60}[radiusSpinner.getSelectedItemPosition()];'
          if old_spinner in s:
              s = s.replace(old_spinner, new_spinner, 1)
          if old_values in s:
              s = s.replace(old_values, new_values, 1)
          if '60 km' not in s or '5,10,20,30,60' not in s:
              raise SystemExit("Impossible de confirmer le rayon 60 km")
          p.write_text(s, encoding="utf-8")
          PY

      - name: Verifier et deployer le logo Essence Quebec
        shell: bash
        run: |
          set -euo pipefail
          RES="EssenceLanaudiere/app/src/main/res"
          LOGO="$RES/drawable/essence_quebec_logo.png"
          echo '3e99fff8892de7c56f773ad5d20fa70f8562c6668b3b60f059d6d114a97e5e98  '"$LOGO" | sha256sum -c -
          file "$LOGO" | grep -F 'PNG image data, 48 x 48'
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "$RES/$d"
            cp "$LOGO" "$RES/$d/ic_launcher.png"
          done

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compiler APK debug
        run: gradle -p EssenceLanaudiere :app:assembleDebug --stacktrace

      - name: Verifier APK et logo embarque
        shell: bash
        run: |
          set -euo pipefail
          APK="EssenceLanaudiere/app/build/outputs/apk/debug/app-debug.apk"
          unzip -t "$APK" >/dev/null
          unzip -p "$APK" res/drawable/essence_quebec_logo.png > /tmp/logo-apk.png
          echo '3e99fff8892de7c56f773ad5d20fa70f8562c6668b3b60f059d6d114a97e5e98  /tmp/logo-apk.png' | sha256sum -c -
          file /tmp/logo-apk.png | grep -F 'PNG image data, 48 x 48'

      - name: Renommer APK
        run: cp EssenceLanaudiere/app/build/outputs/apk/debug/app-debug.apk Essence-Quebec.apk

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Essence-Lanaudiere-APK
          path: Essence-Quebec.apk
          retention-days: 30
