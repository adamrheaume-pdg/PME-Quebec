name: Compiler Essence Lanaudiere APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'EssenceLanaudiere/**'
      - '.github/workflows/build-essence-lanaudiere.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compiler APK debug
        run: gradle -p EssenceLanaudiere :app:assembleDebug --stacktrace

      - name: Renommer APK
        run: cp EssenceLanaudiere/app/build/outputs/apk/debug/app-debug.apk Essence-Lanaudiere.apk

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Essence-Lanaudiere-APK
          path: Essence-Lanaudiere.apk
          retention-days: 30
