name: Compiler Québec 360 Données

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/quebec360data/**'
      - '.github/workflows/build-quebec360data.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler APK debug
        run: gradle -p apps/quebec360data :app:assembleDebug --stacktrace

      - name: Renommer APK
        run: cp apps/quebec360data/app/build/outputs/apk/debug/app-debug.apk Quebec-360-Donnees-v1.0.apk

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Quebec-360-Donnees-v1.0
          path: Quebec-360-Donnees-v1.0.apk
          retention-days: 30
