name: Compiler Detecteur 360 Quebec APK

on:
  workflow_dispatch:
  push:
    branches: [ detecteur-360-quebec ]
    paths:
      - 'Detecteur360Quebec/**'
      - '.github/workflows/build-detecteur-360-quebec.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Detecteur360Quebec/**'
      - '.github/workflows/build-detecteur-360-quebec.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compiler APK
        run: gradle -p Detecteur360Quebec :app:assembleDebug --stacktrace

      - name: Verifier APK
        run: unzip -t Detecteur360Quebec/app/build/outputs/apk/debug/app-debug.apk >/dev/null

      - name: Renommer APK
        run: cp Detecteur360Quebec/app/build/outputs/apk/debug/app-debug.apk 'Detecteur-360-Quebec.apk'

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Detecteur-360-Quebec-APK
          path: Detecteur-360-Quebec.apk
          retention-days: 30
