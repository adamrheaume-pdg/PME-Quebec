name: Compiler APK PME Québec

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: pme-quebec-apk-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer Android SDK
        uses: android-actions/setup-android@v3
      - name: Utiliser le code source réparé
        run: |
          GRADLE_DIR="$GITHUB_WORKSPACE/source-5.10.4/PME-Quebec-5.10-Native-Wyze-Source"
          test -f "$GRADLE_DIR/settings.gradle"
          echo "GRADLE_DIR=$GRADLE_DIR" >> "$GITHUB_ENV"
      - name: Intégrer l'icône Inc Québec
        run: |
          ICON_B64="$GRADLE_DIR/app/pme_inc_quebec_icon.b64"
          ICON_DIR="$GRADLE_DIR/app/src/main/res/drawable"
          mkdir -p "$ICON_DIR"
          test -s "$ICON_B64"
          base64 --decode "$ICON_B64" > "$ICON_DIR/pme_inc_quebec_icon.jpg"
          test -s "$ICON_DIR/pme_inc_quebec_icon.jpg"
          grep -q 'android:icon="@drawable/pme_inc_quebec_icon"' "$GRADLE_DIR/app/src/main/AndroidManifest.xml"
          grep -q 'android:roundIcon="@drawable/pme_inc_quebec_icon"' "$GRADLE_DIR/app/src/main/AndroidManifest.xml"
      - name: Vérifier Supabase
        run: |
          curl --fail --silent --show-error --max-time 15 -H 'apikey: sb_publishable_21Hj2UvI7rPkG3d_GUkEQQ_EByUbC-V' 'https://tziawkkcwkzhfylmldih.supabase.co/auth/v1/health' >/dev/null
      - name: Embarquer les moteurs Web dans l'APK
        run: |
          VENDOR="$GRADLE_DIR/app/src/main/assets/vendor"
          mkdir -p "$VENDOR"
          curl --fail --location --silent --show-error "https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" -o "$VENDOR/html5-qrcode.min.js"
          curl --fail --location --silent --show-error "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" -o "$VENDOR/supabase-js.min.js"
          test -s "$VENDOR/html5-qrcode.min.js" && test -s "$VENDOR/supabase-js.min.js"
      - name: Réparer la connexion Android
        run: python3 .github/scripts/patch_android_login.py
      - name: Réparer structure GOD et interface mobile
        run: python3 .github/scripts/patch_admin_fleur_header.py
      - name: Diagnostic complet APK
        run: python3 .github/scripts/full_apk_diagnostic.py
      - name: Vérifier scanner, connexion et interface mobile
        run: |
          HTML="$GRADLE_DIR/app/src/main/assets/index.html"
          grep -q 'src="vendor/html5-qrcode.min.js"' "$HTML"
          grep -q 'src="vendor/supabase-js.min.js"' "$HTML"
          grep -q 'pme-login-android-5110' "$HTML"
          grep -q 'pme-login-runtime-5110' "$HTML"
          grep -q 'pme-auth-closed' "$HTML"
          grep -q 'function closeGate' "$HTML"
          grep -q 'setTimeout(closeGate,250)' "$HTML"
          grep -q 'pme-admin-fleur-header-5140' "$HTML"
          grep -q 'pme-admin-fleur-runtime-5140' "$HTML"
          grep -q 'pmeAdminFleurLauncher' "$HTML"
          grep -q '.god-global-launcher { display: none !important; }' "$HTML"
          grep -q '<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>' "$HTML"
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import os

          p=Path(os.environ['GRADLE_DIR'])/'app/src/main/assets/index.html'
          s=p.read_text(encoding='utf-8')
          lower=s.lower()
          assert s.rfind('pme-admin-fleur-runtime-5140') < lower.rfind('</body>')
          assert s.rfind('pme-admin-fleur-header-5140') < lower.rfind('</head>')

          # Le template GOD ne doit plus pouvoir fermer la balise <script> inline.
          a=s.find('function godPreviewDocument(htmlCode,cssCode)')
          b=s.find('function renderGodHtmlPreview()',a+1)
          assert a>=0 and b>a
          assert '</script>' not in s[a:b]

          # Simule le parseur HTML du WebView: aucun code JS GOD ne doit devenir
          # un noeud texte visible dans le document.
          class LeakParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.in_script=False
                  self.in_style=False
                  self.visible=[]
              def handle_starttag(self,tag,attrs):
                  if tag.lower()=='script': self.in_script=True
                  if tag.lower()=='style': self.in_style=True
              def handle_endtag(self,tag):
                  if tag.lower()=='script': self.in_script=False
                  if tag.lower()=='style': self.in_style=False
              def handle_data(self,data):
                  if not self.in_script and not self.in_style:
                      self.visible.append(data)
          parser=LeakParser(); parser.feed(s)
          visible='\n'.join(parser.visible)
          forbidden=['function renderGodHtmlPreview','function ensureGodCustomStyle','function sanitizeGodHtml']
          for token in forbidden:
              assert token not in visible, f'Code GOD visible dans le DOM: {token}'

          # Le correctif mobile doit forcer la barre d édition hors sticky/fixed.
          assert '#mainEditToolbar,' in s
          assert 'position: relative !important;' in s
          assert 'top: auto !important;' in s
          PY
      - name: Préparer Gradle
        run: |
          cd "$GRADLE_DIR"; if [ -f "./gradlew" ]; then chmod +x ./gradlew; fi
      - name: Android Lint
        run: |
          cd "$GRADLE_DIR"; if [ -f "./gradlew" ]; then ./gradlew lintDebug; else gradle lintDebug; fi
      - name: Tests Gradle
        run: |
          cd "$GRADLE_DIR"; if [ -f "./gradlew" ]; then ./gradlew testDebugUnitTest; else gradle testDebugUnitTest; fi
      - name: Compiler APK
        run: |
          cd "$GRADLE_DIR"; if [ -f "./gradlew" ]; then ./gradlew assembleDebug; else gradle assembleDebug; fi
      - name: Trouver APK
        run: |
          APK=$(find "$GRADLE_DIR" -type f -name "*.apk" | head -1)
          test -n "$APK"; cp "$APK" "$GITHUB_WORKSPACE/PME-Quebec.apk"
      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: PME-Quebec-APK
          path: PME-Quebec.apk
          if-no-files-found: error
