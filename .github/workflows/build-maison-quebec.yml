name: Compiler WiFi Québec APK

on:
  push:
    branches: [ maison-quebec ]
    paths:
      - 'MaisonQuebec/**'
      - '.github/workflows/build-maison-quebec.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer identité Android WiFi Québec
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('MaisonQuebec/app/build.gradle')
          s = p.read_text()
          s, n1 = re.subn(r'applicationId\s+["\'][^"\']+["\']', 'applicationId "quebec.reseau.wifiquebec"', s, count=1)
          s, n2 = re.subn(r'versionCode\s+\d+', 'versionCode 10', s, count=1)
          s, n3 = re.subn(r'versionName\s+["\'][^"\']+["\']', 'versionName "1.10.0"', s, count=1)
          if n1 != 1:
              raise SystemExit('applicationId introuvable dans app/build.gradle')
          if n2 != 1:
              raise SystemExit('versionCode introuvable dans app/build.gradle')
          if n3 != 1:
              raise SystemExit('versionName introuvable dans app/build.gradle')
          p.write_text(s)
          print('Identité Android:', 'quebec.reseau.wifiquebec', 'v1.10.0 (10)')
          PY

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler APK debug
        run: gradle -p MaisonQuebec :app:assembleDebug --stacktrace

      - name: Vérifier APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose MaisonQuebec/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging MaisonQuebec/app/build/outputs/apk/debug/app-debug.apk | head -5

      - name: Renommer APK
        run: cp MaisonQuebec/app/build/outputs/apk/debug/app-debug.apk WiFi-Quebec-v1.10.apk

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Quebec-v1.10-APK
          path: WiFi-Quebec-v1.10.apk
          if-no-files-found: error
