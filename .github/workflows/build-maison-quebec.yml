name: Compiler WiFi Québec APK

on:
  push:
    branches: [ maison-quebec ]
    paths:
      - 'MaisonQuebec/**'
      - '.github/workflows/build-maison-quebec.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer identité Android WiFi Québec
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('MaisonQuebec/app/build.gradle')
          s = p.read_text()
          s, n1 = re.subn(r'applicationId\s+["\'][^"\']+["\']', 'applicationId "quebec.reseau.wifiquebec"', s, count=1)
          s, n2 = re.subn(r'versionCode\s+\d+', 'versionCode 13', s, count=1)
          s, n3 = re.subn(r'versionName\s+["\'][^"\']+["\']', 'versionName "1.13.0"', s, count=1)
          if n1 != 1 or n2 != 1 or n3 != 1:
              raise SystemExit('Identité Android incomplète dans app/build.gradle')
          p.write_text(s)
          print('Identité Android: quebec.reseau.wifiquebec v1.13.0 (13)')
          PY

      - name: Activer l'analyseur Wi-Fi dans l'accueil
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('MaisonQuebec/app/src/main/java/quebec/maison/universelle/MainActivity.java')
          s=p.read_text()
          needle='findViewById(R.id.btnScan).setOnClickListener(v->scanNetwork());'
          add=needle+'\n        findViewById(R.id.btnAnalyzer).setOnClickListener(v->startActivity(new Intent(this,WifiAnalyzerActivity.class)));'
          if 'R.id.btnAnalyzer' not in s:
              if needle not in s: raise SystemExit('Point insertion analyseur introuvable')
              s=s.replace(needle,add,1)
          p.write_text(s)
          a=Path('MaisonQuebec/app/src/main/java/quebec/maison/universelle/WifiAnalyzerActivity.java')
          q=a.read_text()
          if 'android.graphics.drawable.GradientDrawable' not in q:
              q=q.replace('import android.graphics.*;','import android.graphics.*;\nimport android.graphics.drawable.GradientDrawable;')
          a.write_text(q)
          PY

      - name: Restaurer le vrai logo WiFi Québec
        run: |
          mkdir -p /tmp/wifi-logo
          cat MaisonQuebec/app/src/main/res/raw/logo_part0.txt \
              MaisonQuebec/app/src/main/res/raw/logo_part1.txt \
              MaisonQuebec/app/src/main/res/raw/logo_part2.txt \
              MaisonQuebec/app/src/main/res/raw/logo_part3.txt > /tmp/wifi-logo/logo.b64
          base64 -d /tmp/wifi-logo/logo.b64 > /tmp/wifi-logo/ic_launcher.png
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/wifi-logo/ic_launcher.png'); b=p.read_bytes()
          if not b.startswith(b'\x89PNG\r\n\x1a\n') or len(b)<5000: raise SystemExit('Logo PNG invalide')
          print('Logo PNG valide:',len(b),'octets')
          PY
          cp /tmp/wifi-logo/ic_launcher.png MaisonQuebec/app/src/main/res/drawable/ic_launcher.png
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "MaisonQuebec/app/src/main/res/mipmap-$d"
            cp /tmp/wifi-logo/ic_launcher.png "MaisonQuebec/app/src/main/res/mipmap-$d/ic_launcher.png"
            cp /tmp/wifi-logo/ic_launcher.png "MaisonQuebec/app/src/main/res/mipmap-$d/ic_launcher_round.png"
          done

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler APK debug
        run: gradle -p MaisonQuebec :app:assembleDebug --stacktrace

      - name: Vérifier APK et icône
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose MaisonQuebec/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging MaisonQuebec/app/build/outputs/apk/debug/app-debug.apk | head -8
          unzip -l MaisonQuebec/app/build/outputs/apk/debug/app-debug.apk | grep -E 'ic_launcher|WifiAnalyzerActivity' | head -30

      - name: Renommer APK
        run: cp MaisonQuebec/app/build/outputs/apk/debug/app-debug.apk WiFi-Quebec-v1.13.apk

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Quebec-v1.13-APK
          path: WiFi-Quebec-v1.13.apk
          if-no-files-found: error
