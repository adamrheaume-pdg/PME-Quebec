name: Compiler Maison Québec APK

on:
  push:
    branches: [ maison-quebec ]
    paths:
      - 'MaisonQuebec/**'
      - '.github/workflows/build-maison-quebec.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Installer SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compiler APK debug
        run: gradle -p MaisonQuebec :app:assembleDebug --stacktrace
      - name: Renommer APK
        run: cp MaisonQuebec/app/build/outputs/apk/debug/app-debug.apk Maison-Quebec-v1.0.0.apk
      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Maison-Quebec-APK
          path: Maison-Quebec-v1.0.0.apk
          if-no-files-found: error
