name: Build JobinE 0.3 APK
on:
  push:
    paths:
      - 'JobinE03/**'
      - '.github/workflows/jobine03-folder-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: JobinE03
        run: gradle clean assembleDebug --stacktrace
      - name: Verify APK
        run: |
          test -s JobinE03/app/build/outputs/apk/debug/app-debug.apk
          cp JobinE03/app/build/outputs/apk/debug/app-debug.apk JobinE-0.3.0-installable.apk
          ls -lh JobinE-0.3.0-installable.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JobinE-0.3.0-installable
          path: JobinE-0.3.0-installable.apk
          if-no-files-found: error
