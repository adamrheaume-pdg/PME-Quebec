name: Compiler Cintrage EMT Québec

on:
  push:
    branches:
      - emt-cintrage-apk
    paths:
      - 'emt-cintrage/**'
      - '.github/workflows/build-emt-cintrage.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Configurer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer SDK Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compiler APK debug
        working-directory: emt-cintrage
        run: gradle :app:assembleDebug --stacktrace

      - name: Renommer APK
        run: cp emt-cintrage/app/build/outputs/apk/debug/app-debug.apk 'Cintrage-EMT-Quebec.apk'

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Cintrage-EMT-Quebec
          path: Cintrage-EMT-Quebec.apk
          if-no-files-found: error
