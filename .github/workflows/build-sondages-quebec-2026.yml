name: Build Sondages Quebec 2026 APK

on:
  push:
    branches: [ "sondages-quebec-2026" ]
    paths:
      - 'SondagesQuebec2026/**'
      - '.github/workflows/build-sondages-quebec-2026.yml'
      - '.github/scripts/patch_sondages_qc125_live.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Add election countdown
        working-directory: SondagesQuebec2026
        run: python3 patch_countdown.py

      - name: Add Qc125 live section
        run: python3 .github/scripts/patch_sondages_qc125_live.py

      - name: Respect Android system bars
        working-directory: SondagesQuebec2026
        run: python3 patch_system_insets.py

      - name: Add AdamMimi footer
        working-directory: SondagesQuebec2026
        run: python3 patch_footer.py

      - name: Build release APK
        working-directory: SondagesQuebec2026
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp SondagesQuebec2026/app/build/outputs/apk/release/app-release.apk Sondages-Quebec-2026.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sondages-Quebec-2026-APK
          path: Sondages-Quebec-2026.apk
          if-no-files-found: error
