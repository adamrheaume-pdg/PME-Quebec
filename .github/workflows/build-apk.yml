name: Compiler APK PME Québec

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Décompresser le projet
        run: |
          mkdir -p projet
          ZIP="./PME-Quebec-5.10.4-Barcode-Camera-Fix.zip"
          echo "ZIP trouvé : $ZIP"
          test -f "$ZIP"
          unzip -o "$ZIP" -d projet
          echo "Contenu extrait :"
          find projet -maxdepth 3 -type f | head -100

      - name: Trouver le projet Gradle
        run: |
          GRADLE_FILE=$(find projet \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1)
          test -n "$GRADLE_FILE"
          GRADLE_DIR=$(dirname "$GRADLE_FILE")
          echo "GRADLE_DIR=$GRADLE_DIR" >> "$GITHUB_ENV"
          echo "Projet Android trouvé dans : $GRADLE_DIR"

      - name: Préparer Gradle
        run: |
          cd "$GRADLE_DIR"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Compiler APK
        run: |
          cd "$GRADLE_DIR"
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Trouver APK
        run: |
          APK=$(find "$GRADLE_DIR" -type f -name "*.apk" | head -1)
          echo "APK trouvé : $APK"
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/PME-Quebec.apk"

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: PME-Quebec-APK
          path: PME-Quebec.apk
          if-no-files-found: error
