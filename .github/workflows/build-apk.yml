name: Compiler APK PME Québec

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

            - name: Décompresser le projet
        run: |
          mkdir -p projet
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          echo "ZIP trouvé : $ZIP"
          test -n "$ZIP"
          unzip -o "$ZIP" -d projet
          echo "Contenu extrait :"
          find projet -maxdepth 3 -type f | head -100

      - name: Trouver le projet Gradle
        run: |
          GRADLE_DIR=$(find projet -name "settings.gradle" -o -name "settings.gradle.kts" | head -1 | xargs dirname)
          echo "GRADLE_DIR=$GRADLE_DIR" >> "$GITHUB_ENV"
          echo "Projet Android trouvé dans : $GRADLE_DIR"

      - name: Préparer Gradle
        run: |
          cd "$GRADLE_DIR"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "Gradle Wrapper absent — installation de Gradle"
            gradle --version
          fi

      - name: Compiler APK
        run: |
          cd "$GRADLE_DIR"
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Trouver APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk-sortie"
          find "$GRADLE_DIR" -type f -name "*.apk" -exec cp {} "$GITHUB_WORKSPACE/apk-sortie/" \;
          ls -lh "$GITHUB_WORKSPACE/apk-sortie"

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: PME-Quebec-APK
          path: apk-sortie/*.apk
          if-no-files-found: error
