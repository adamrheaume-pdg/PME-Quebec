name: Compiler Rabais Quebec APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'RabaisQuebec/**'
      - '.github/workflows/build-rabais-quebec.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Installer Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compiler APK debug
        run: gradle -p RabaisQuebec :app:assembleDebug --stacktrace
      - name: Verifier APK
        shell: bash
        run: |
          set -euo pipefail
          APK='RabaisQuebec/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
      - name: Renommer APK
        run: cp RabaisQuebec/app/build/outputs/apk/debug/app-debug.apk Rabais-Quebec.apk
      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Rabais-Quebec-APK
          path: Rabais-Quebec.apk
          retention-days: 30
