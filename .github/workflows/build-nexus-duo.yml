name: Build Nexus Duo APK

on:
  push:
    branches:
      - nexus-duo-build
    paths:
      - 'NexusDuo/**'
      - '.github/workflows/build-nexus-duo.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Ensure Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Build debug APK
        run: gradle -p NexusDuo :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp NexusDuo/app/build/outputs/apk/debug/app-debug.apk NexusDuo/Nexus-Duo-v3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Duo-v3
          path: NexusDuo/Nexus-Duo-v3.apk
          if-no-files-found: error
