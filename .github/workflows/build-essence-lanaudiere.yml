name: Compiler Essence Quebec APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'EssenceLanaudiere/**'
      - '.github/workflows/build-essence-lanaudiere.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Installer Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Integrer carte logos position et zones securitaires
        run: python3 EssenceLanaudiere/build_tools/patch_map.py
      - name: Integrer alertes prix et corriger villes doubles
        run: python3 EssenceLanaudiere/build_tools/patch_alerts.py
      - name: Ajouter prix moyens Canada USA convertis par litre
        run: python3 EssenceLanaudiere/build_tools/patch_regional_prices.py
      - name: Appliquer theme premium bleu natif
        run: python3 EssenceLanaudiere/build_tools/patch_premium_theme.py
      - name: Ajouter cameras Quebec 511
        run: python3 EssenceLanaudiere/build_tools/patch_mtq_cameras.py
      - name: Ajouter alerte radar photo securitaire 1 km
        run: python3 EssenceLanaudiere/build_tools/patch_radar_safety.py
      - name: Afficher stations individuellement et POI restaurants
        run: python3 EssenceLanaudiere/build_tools/patch_uncluster_poi.py
      - name: Ameliorer navigation et carte interactive
        run: python3 EssenceLanaudiere/build_tools/patch_navigation_map.py
      - name: Appliquer finition visuelle punchee
        run: python3 EssenceLanaudiere/build_tools/patch_visual_punch.py
      - name: Appliquer interface neon conduite
        run: python3 EssenceLanaudiere/build_tools/patch_neon_drive_ui.py
      - name: Relier notifications a Google Maps
        run: python3 EssenceLanaudiere/build_tools/patch_notification_maps.py
      - name: Appliquer interface finale selon la reference
        run: python3 EssenceLanaudiere/build_tools/patch_reference_ui.py
      - name: Appliquer carte immersive reference v2
        run: python3 EssenceLanaudiere/build_tools/patch_reference_map_v2.py
      - name: Reconstruire les vraies images utilisateur
        run: python3 EssenceLanaudiere/build_tools/rebuild_user_assets.py
      - name: Appliquer les commandes utilisateur Essence Quebec
        run: python3 EssenceLanaudiere/build_tools/patch_user_requests.py
      - name: Utiliser la carte GPS dynamique sur l accueil
        run: python3 EssenceLanaudiere/build_tools/patch_home_map_final.py
      - name: Ajouter QUB radio en arriere-plan
        run: python3 EssenceLanaudiere/build_tools/patch_qub_radio.py
      - name: Ajouter bouton de fermeture complete
        run: python3 EssenceLanaudiere/build_tools/patch_shutdown.py
      - name: Verifier la refonte active
        shell: bash
        run: |
          set -euo pipefail
          FILE="EssenceLanaudiere/app/src/main/java/quebec/lanaudiere/essence/MainActivity.java"
          MANIFEST="EssenceLanaudiere/app/src/main/AndroidManifest.xml"
          SERVICE="EssenceLanaudiere/app/src/main/java/quebec/lanaudiere/essence/QubPlaybackService.java"
          grep -F '60 km' "$FILE"
          grep -F 'VOUS ÊTES ICI' "$FILE"
          grep -F 'Button tMap=primaryButton("Carte")' "$FILE"
          grep -F 'Button tList=ghostButton("Liste")' "$FILE"
          grep -F 'Button tFav=ghostButton("Favoris")' "$FILE"
          grep -F 'LES BONS PRIX' "$FILE"
          grep -F 'TOUJOURS PLUS LOIN' "$FILE"
          grep -F 'loadBrandLogo(brand,x.name)' "$FILE"
          grep -F 'displayStationAddress(x)' "$FILE"
          grep -F 'RADAR_PHOTO_GEOJSON' "$FILE"
          grep -F 'FOOD_POI_OVERPASS' "$FILE"
          grep -F "McDonald's" "$FILE"
          grep -F 'Tim Hortons' "$FILE"
          grep -F 'const streets=L.tileLayer' "$FILE"
          grep -F 'const satellite=L.tileLayer' "$FILE"
          grep -F 'L.control.layers' "$FILE"
          grep -F 'setContentIntent(go)' "$FILE"
          grep -F 'com.google.android.apps.maps' "$FILE"
          grep -F 'private void showStationReference(Station s)' "$FILE"
          grep -F 'private void showStatsReference()' "$FILE"
          grep -F 'private void showMissionsReference()' "$FILE"
          grep -F 'referenceSunset()' "$FILE"
          grep -F 'ITINÉRAIRE' "$FILE"
          grep -F 'private GradientDrawable shutdownSafeBg()' "$FILE"
          grep -F 'pricePin' "$FILE"
          grep -F 'dp(620)' "$FILE"
          grep -F 'QUB RADIO • EN DIRECT' "$FILE"
          grep -F 'startForegroundService(i)' "$FILE"
          grep -F 'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK' "$MANIFEST"
          grep -F 'android:foregroundServiceType="mediaPlayback"' "$MANIFEST"
          grep -F 'QUB_RADIOAAC.aac' "$SERVICE"
          grep -F 'stationBannerResource' "$FILE"
          grep -F 'showStationHours(s)' "$FILE"
          grep -F 'showStationServices(s)' "$FILE"
          grep -F 'toggleStationFavorite(s)' "$FILE"
          grep -F 'shareStation(s)' "$FILE"
          grep -F 'startLiveMapTracking' "$FILE"
          grep -F 'window.eqLastUser' "$FILE"
          grep -F 'marker_mccafe.png' "$FILE"
          grep -F 'marker_tim.png' "$FILE"
          grep -F 'marker_atm.png' "$FILE"
          grep -F 'marker_radar.png' "$FILE"
          grep -F 'money_bundle' "$FILE"
          if grep -Fq 'markerClusterGroup' "$FILE"; then echo 'ERREUR: regroupement des stations encore present'; exit 1; fi
      - name: Verifier les vraies ressources graphiques
        shell: bash
        run: |
          set -euo pipefail
          test -s EssenceLanaudiere/app/src/main/assets/marker_mccafe.png
          test -s EssenceLanaudiere/app/src/main/assets/marker_tim.png
          test -s EssenceLanaudiere/app/src/main/assets/marker_atm.png
          test -s EssenceLanaudiere/app/src/main/assets/marker_radar.png
          test -s EssenceLanaudiere/app/src/main/res/drawable/station_shell.jpg
          test -s EssenceLanaudiere/app/src/main/res/drawable/station_irving.jpg
          file EssenceLanaudiere/app/src/main/assets/marker_mccafe.png | grep -F 'PNG image data'
          file EssenceLanaudiere/app/src/main/assets/marker_tim.png | grep -F 'PNG image data'
          file EssenceLanaudiere/app/src/main/assets/marker_atm.png | grep -F 'PNG image data'
          file EssenceLanaudiere/app/src/main/assets/marker_radar.png | grep -F 'PNG image data'
      - name: Verifier et deployer le logo Essence Quebec
        shell: bash
        run: |
          set -euo pipefail
          RES="EssenceLanaudiere/app/src/main/res"
          LOGO="$RES/drawable/essence_quebec_logo.png"
          test -s "$LOGO"
          file "$LOGO" | grep -F 'PNG image data'
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "$RES/$d"
            cp "$LOGO" "$RES/$d/ic_launcher.png"
          done
      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compiler APK debug
        run: gradle -p EssenceLanaudiere :app:assembleDebug --stacktrace
      - name: Verifier APK et ressources embarquees
        shell: bash
        run: |
          set -euo pipefail
          APK="EssenceLanaudiere/app/build/outputs/apk/debug/app-debug.apk"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -F 'assets/marker_mccafe.png'
          unzip -l "$APK" | grep -F 'assets/marker_tim.png'
          unzip -l "$APK" | grep -F 'assets/marker_atm.png'
          unzip -l "$APK" | grep -F 'assets/marker_radar.png'
          unzip -p "$APK" res/drawable/essence_quebec_logo.png > /tmp/logo-apk.png
          test -s /tmp/logo-apk.png
          file /tmp/logo-apk.png | grep -F 'PNG image data'
      - name: Renommer APK
        run: cp EssenceLanaudiere/app/build/outputs/apk/debug/app-debug.apk Essence-Quebec-1.6.1.apk
      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Essence-Quebec-1.6.1
          path: Essence-Quebec-1.6.1.apk
          retention-days: 30
          if-no-files-found: error
