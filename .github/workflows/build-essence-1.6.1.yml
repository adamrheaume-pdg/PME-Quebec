name: Compiler Essence Quebec 1.7.0

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'EssenceLanaudiere/**'
      - '.github/workflows/build-essence-1.6.1.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Installer Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Appliquer les ameliorations existantes
        shell: bash
        run: |
          set -euo pipefail
          python3 EssenceLanaudiere/build_tools/patch_map.py
          python3 EssenceLanaudiere/build_tools/patch_alerts.py
          python3 EssenceLanaudiere/build_tools/patch_regional_prices.py
          python3 EssenceLanaudiere/build_tools/patch_premium_theme.py
          python3 EssenceLanaudiere/build_tools/patch_mtq_cameras.py
          python3 EssenceLanaudiere/build_tools/patch_radar_safety.py
          python3 EssenceLanaudiere/build_tools/patch_uncluster_poi.py
          python3 EssenceLanaudiere/build_tools/patch_navigation_map.py
          python3 EssenceLanaudiere/build_tools/patch_visual_punch.py
          python3 EssenceLanaudiere/build_tools/patch_neon_drive_ui.py
          python3 EssenceLanaudiere/build_tools/patch_notification_maps.py
          python3 EssenceLanaudiere/build_tools/patch_reference_ui.py
          python3 EssenceLanaudiere/build_tools/patch_reference_map_v2.py
      - name: Construire le paquet de ressources en preservant les images utilisateur
        run: python3 EssenceLanaudiere/build_tools/generate_user_assets.py
      - name: Appliquer les images et fonctions demandees
        run: python3 EssenceLanaudiere/build_tools/patch_user_requests.py
      - name: Mettre la navigation GPS dynamique sur la carte d accueil
        run: python3 EssenceLanaudiere/build_tools/patch_home_map_final.py
      - name: Ajouter QUB et fermeture avant le profil 1.7.0
        shell: bash
        run: |
          set -euo pipefail
          python3 EssenceLanaudiere/build_tools/patch_qub_radio.py
          python3 EssenceLanaudiere/build_tools/patch_shutdown.py
      - name: Appliquer les fonctions Essence Quebec 1.7.0
        run: python3 EssenceLanaudiere/build_tools/patch_v170.py
      - name: Verifier les icones utilisateur avant compilation
        shell: bash
        run: |
          set -euo pipefail
          for f in marker_mccafe.png marker_tim.png marker_atm.png marker_radar.png; do
            test -s "EssenceLanaudiere/app/src/main/assets/$f"
            file "EssenceLanaudiere/app/src/main/assets/$f" | grep -F 'PNG image data'
          done
          grep -F 'file:///android_asset/marker_mccafe.png' EssenceLanaudiere/app/src/main/java/quebec/lanaudiere/essence/MainActivity.java
          grep -F 'file:///android_asset/marker_tim.png' EssenceLanaudiere/app/src/main/java/quebec/lanaudiere/essence/MainActivity.java
          grep -F 'file:///android_asset/marker_atm.png' EssenceLanaudiere/app/src/main/java/quebec/lanaudiere/essence/MainActivity.java
          grep -F 'file:///android_asset/marker_radar.png' EssenceLanaudiere/app/src/main/java/quebec/lanaudiere/essence/MainActivity.java
          grep -F 'window.eqLastUser' EssenceLanaudiere/app/src/main/java/quebec/lanaudiere/essence/MainActivity.java
      - name: Deployer le logo Essence Quebec
        shell: bash
        run: |
          set -euo pipefail
          RES="EssenceLanaudiere/app/src/main/res"
          LOGO="$RES/drawable/essence_quebec_logo.png"
          test -s "$LOGO"
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "$RES/$d"
            cp "$LOGO" "$RES/$d/ic_launcher.png"
          done
      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compiler APK
        run: gradle -p EssenceLanaudiere :app:assembleDebug --stacktrace
      - name: Verifier APK final
        shell: bash
        run: |
          set -euo pipefail
          APK="EssenceLanaudiere/app/build/outputs/apk/debug/app-debug.apk"
          unzip -t "$APK" >/dev/null
          for f in marker_mccafe.png marker_tim.png marker_atm.png marker_radar.png; do
            unzip -l "$APK" | grep -F "assets/$f"
          done
          unzip -l "$APK" | grep -F 'res/drawable/essence_quebec_logo.png'
      - name: Nommer APK
        run: cp EssenceLanaudiere/app/build/outputs/apk/debug/app-debug.apk Essence-Quebec-1.7.0.apk
      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Essence-Quebec-1.7.0
          path: Essence-Quebec-1.7.0.apk
          retention-days: 30
          if-no-files-found: error
