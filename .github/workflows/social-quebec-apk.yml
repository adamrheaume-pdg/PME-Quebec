name: Build Social Quebec APK

on:
  push:
    branches: [ social-quebec-build-final ]
    paths:
      - 'social-quebec/**'
      - '.github/workflows/social-quebec-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Build debug APK
        run: gradle -p social-quebec :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp social-quebec/app/build/outputs/apk/debug/app-debug.apk Social-Quebec-v1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Social-Quebec-APK
          path: Social-Quebec-v1.0.0.apk
          retention-days: 30
