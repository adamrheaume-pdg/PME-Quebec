name: Culture du Quebec - Android APK

on:
  push:
    paths:
      - 'CultureQuebec/**'
      - '.github/workflows/culture-quebec-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CultureQuebec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Archive APK
        uses: actions/upload-artifact@v4
        with:
          name: Culture-du-Quebec-1.0.0
          path: CultureQuebec/app/build/outputs/apk/debug/app-debug.apk
