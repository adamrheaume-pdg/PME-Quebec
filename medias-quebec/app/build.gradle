plugins {
    id 'com.android.application'
}

android {
    namespace 'quebec.medias.app'
    compileSdk 35

    defaultConfig {
        applicationId 'quebec.medias.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "Medias-Quebec-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}
