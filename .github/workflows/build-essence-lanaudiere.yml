name: Compiler Essence Lanaudiere APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'EssenceLanaudiere/**'
      - '.github/workflows/build-essence-lanaudiere.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Ajouter rayon 60 km
        shell: bash
        run: |
          set -euo pipefail
          FILE="EssenceLanaudiere/app/src/main/java/quebec/lanaudiere/essence/MainActivity.java"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("EssenceLanaudiere/app/src/main/java/quebec/lanaudiere/essence/MainActivity.java")
          s = p.read_text(encoding="utf-8")
          old_spinner = 'radiusSpinner=spinner(new String[]{"5 km","10 km","20 km","30 km"}); radiusSpinner.setSelection(3);'
          new_spinner = 'radiusSpinner=spinner(new String[]{"5 km","10 km","20 km","30 km","60 km"}); radiusSpinner.setSelection(3);'
          old_values = 'int radius=new int[]{5,10,20,30}[radiusSpinner.getSelectedItemPosition()];'
          new_values = 'int radius=new int[]{5,10,20,30,60}[radiusSpinner.getSelectedItemPosition()];'
          if old_spinner in s:
              s = s.replace(old_spinner, new_spinner, 1)
          if old_values in s:
              s = s.replace(old_values, new_values, 1)
          if '60 km' not in s or '5,10,20,30,60' not in s:
              raise SystemExit("Impossible de confirmer le rayon 60 km")
          p.write_text(s, encoding="utf-8")
          PY
          grep -F '60 km' "$FILE"
          grep -F '5,10,20,30,60' "$FILE"

      - name: Integrer le logo Essence Quebec exact et icone adaptative
        shell: bash
        run: |
          set -euo pipefail
          RES="EssenceLanaudiere/app/src/main/res"
          mkdir -p "$RES/drawable" "$RES/mipmap-anydpi-v26" "$RES/values"
          cat EssenceLanaudiere/logo/icon.part00 EssenceLanaudiere/logo/icon.part01 EssenceLanaudiere/logo/icon.part02 EssenceLanaudiere/logo/icon.part03 | base64 --decode > "$RES/drawable/essence_quebec_logo.png"
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "$RES/$d"
            cp "$RES/drawable/essence_quebec_logo.png" "$RES/$d/ic_launcher.png"
          done
          cat > "$RES/values/icon_colors.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="essence_icon_background">#0A1528</color>
          </resources>
          XML
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/essence_icon_background" />
              <foreground android:drawable="@drawable/essence_quebec_logo" />
          </adaptive-icon>
          XML
          file "$RES/drawable/essence_quebec_logo.png"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compiler APK debug
        run: gradle -p EssenceLanaudiere :app:assembleDebug --stacktrace

      - name: Renommer APK
        run: cp EssenceLanaudiere/app/build/outputs/apk/debug/app-debug.apk Essence-Quebec.apk

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Essence-Lanaudiere-APK
          path: Essence-Quebec.apk
          retention-days: 30
