name: Compiler APK PME Québec

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: pme-quebec-apk-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Utiliser le code source réparé
        run: |
          GRADLE_DIR="$GITHUB_WORKSPACE/source-5.10.4/PME-Quebec-5.10-Native-Wyze-Source"
          test -f "$GRADLE_DIR/settings.gradle"
          echo "GRADLE_DIR=$GRADLE_DIR" >> "$GITHUB_ENV"
          echo "Compilation depuis : $GRADLE_DIR"

      - name: Embarquer les moteurs Web dans l'APK
        run: |
          VENDOR="$GRADLE_DIR/app/src/main/assets/vendor"
          mkdir -p "$VENDOR"
          curl --fail --location --silent --show-error "https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" -o "$VENDOR/html5-qrcode.min.js"
          curl --fail --location --silent --show-error "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" -o "$VENDOR/supabase-js.min.js"
          test -s "$VENDOR/html5-qrcode.min.js"
          test -s "$VENDOR/supabase-js.min.js"
          echo "Scanner et Supabase embarqués"

      - name: Réparer la connexion Android
        run: python3 .github/scripts/patch_android_login.py

      - name: Vérifier scanner et connexion locaux
        run: |
          HTML="$GRADLE_DIR/app/src/main/assets/index.html"
          grep -q 'src="vendor/html5-qrcode.min.js"' "$HTML"
          grep -q 'src="vendor/supabase-js.min.js"' "$HTML"
          grep -q 'pme-login-android-5107' "$HTML"
          grep -q 'pme-login-runtime-5107' "$HTML"
          if grep -q 'src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"' "$HTML"; then exit 1; fi
          if grep -q 'src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"' "$HTML"; then exit 1; fi

      - name: Préparer Gradle
        run: |
          cd "$GRADLE_DIR"
          if [ -f "./gradlew" ]; then chmod +x ./gradlew; fi

      - name: Compiler APK
        run: |
          cd "$GRADLE_DIR"
          if [ -f "./gradlew" ]; then ./gradlew assembleDebug; else gradle assembleDebug; fi

      - name: Trouver APK
        run: |
          APK=$(find "$GRADLE_DIR" -type f -name "*.apk" | head -1)
          echo "APK trouvé : $APK"
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/PME-Quebec.apk"

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: PME-Quebec-APK
          path: PME-Quebec.apk
          if-no-files-found: error
