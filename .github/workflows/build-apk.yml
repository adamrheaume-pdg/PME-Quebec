name: Compiler APK PME Québec

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: pme-quebec-apk-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Utiliser le code source réparé
        run: |
          GRADLE_DIR="$GITHUB_WORKSPACE/source-5.10.4/PME-Quebec-5.10-Native-Wyze-Source"
          test -f "$GRADLE_DIR/settings.gradle"
          echo "GRADLE_DIR=$GRADLE_DIR" >> "$GITHUB_ENV"
          echo "Compilation depuis : $GRADLE_DIR"

      - name: Embarquer le moteur code-barres dans l'APK
        run: |
          VENDOR="$GRADLE_DIR/app/src/main/assets/vendor"
          mkdir -p "$VENDOR"
          curl --fail --location --silent --show-error \
            "https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" \
            -o "$VENDOR/html5-qrcode.min.js"
          test -s "$VENDOR/html5-qrcode.min.js"
          echo "Moteur scanner local prêt : $(wc -c < "$VENDOR/html5-qrcode.min.js") octets"

      - name: Vérifier que le scanner utilise le moteur local
        run: |
          HTML="$GRADLE_DIR/app/src/main/assets/index.html"
          grep -q 'src="vendor/html5-qrcode.min.js"' "$HTML"
          if grep -q 'src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"' "$HTML"; then
            echo "ERREUR : le scanner dépend encore du CDN." >&2
            exit 1
          fi

      - name: Préparer Gradle
        run: |
          cd "$GRADLE_DIR"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Compiler APK
        run: |
          cd "$GRADLE_DIR"
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Trouver APK
        run: |
          APK=$(find "$GRADLE_DIR" -type f -name "*.apk" | head -1)
          echo "APK trouvé : $APK"
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/PME-Quebec.apk"

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: PME-Quebec-APK
          path: PME-Quebec.apk
          if-no-files-found: error
