plugins {
    id 'com.android.application'
}

def generatedLogoResDir = layout.buildDirectory.dir('generated/logoRes')

tasks.register('generateOuiLogo') {
    inputs.file(file('logo/oui_logo.b64'))
    outputs.file(generatedLogoResDir.map { it.file('drawable/oui_logo.webp') })
    doLast {
        def out = generatedLogoResDir.get().file('drawable/oui_logo.webp').asFile
        out.parentFile.mkdirs()
        def encoded = file('logo/oui_logo.b64').text.replaceAll('[^A-Za-z0-9+/=]', '')
        out.bytes = java.util.Base64.decoder.decode(encoded)
    }
}

android {
    namespace 'ca.quebec.oui'
    compileSdk 35

    defaultConfig {
        applicationId 'ca.quebec.oui'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '4.5.2'
    }

    sourceSets {
        main.res.srcDir(generatedLogoResDir)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named('preBuild').configure {
    dependsOn(tasks.named('generateOuiLogo'))
}
