name: Compiler APK Hisense 50A6KV

on:
  workflow_dispatch:
  push:
    branches: [hisense-50a6kv-remote]
    paths:
      - 'hisense-remote/**'
      - '.github/workflows/hisense-50a6kv-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Ajouter le moteur VIDAA local
        run: |
          rm -rf /tmp/vidaa-control
          git clone --depth 1 https://github.com/tombabolewski/vidaa-control.git /tmp/vidaa-control
          mkdir -p hisense-remote/app/src/main/python
          rm -rf hisense-remote/app/src/main/python/vidaa
          cp -R /tmp/vidaa-control/vidaa hisense-remote/app/src/main/python/vidaa
          cp /tmp/vidaa-control/LICENSE hisense-remote/VIDAA-CONTROL-LICENSE.txt

      - name: Compiler l'APK
        working-directory: hisense-remote
        run: gradle --no-daemon :app:assembleRelease

      - name: Préparer l'APK
        run: |
          mkdir -p out
          cp hisense-remote/app/build/outputs/apk/release/app-release.apk out/Hisense-50A6KV-Remote-Cast-v1.apk
          sha256sum out/Hisense-50A6KV-Remote-Cast-v1.apk > out/SHA256.txt

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Hisense-50A6KV-Remote-Cast-v1
          path: out/*
          retention-days: 30
