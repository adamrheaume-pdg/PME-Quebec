name: Build JobinE 0.3 APK
on:
  push:
    paths:
      - 'JobinE-source-0.3.zip'
      - '.github/workflows/jobine03-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Decode and extract JobinE 0.3 source
        run: |
          rm -rf JobinE /tmp/jobine03.zip
          base64 -d JobinE-source-0.3.zip > /tmp/jobine03.zip
          unzip -q /tmp/jobine03.zip
      - name: Build clean debug APK
        working-directory: JobinE
        run: gradle clean assembleDebug --stacktrace
      - name: Verify APK exists
        run: |
          test -s JobinE/app/build/outputs/apk/debug/app-debug.apk
          cp JobinE/app/build/outputs/apk/debug/app-debug.apk JobinE-0.3.0-clean.apk
          ls -lh JobinE-0.3.0-clean.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JobinE-0.3.0-clean-APK
          path: JobinE-0.3.0-clean.apk
          if-no-files-found: error
