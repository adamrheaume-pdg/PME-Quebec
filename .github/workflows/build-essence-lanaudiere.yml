name: Compiler Essence Lanaudiere APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'EssenceLanaudiere/**'
      - '.github/workflows/build-essence-lanaudiere.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Installer Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Integrer carte logos position et zones securitaires
        run: python3 EssenceLanaudiere/build_tools/patch_map.py
      - name: Integrer alertes prix et corriger villes doubles
        run: python3 EssenceLanaudiere/build_tools/patch_alerts.py
      - name: Ajouter prix moyens Canada USA convertis par litre
        run: python3 EssenceLanaudiere/build_tools/patch_regional_prices.py
      - name: Appliquer theme premium bleu natif
        run: python3 EssenceLanaudiere/build_tools/patch_premium_theme.py
      - name: Ajouter caméras Québec 511
        run: python3 EssenceLanaudiere/build_tools/patch_mtq_cameras.py
      - name: Ajouter alerte radar photo securitaire 1 km
        run: python3 EssenceLanaudiere/build_tools/patch_radar_safety.py
      - name: Afficher stations individuellement et POI restaurants
        run: python3 EssenceLanaudiere/build_tools/patch_uncluster_poi.py
      - name: Ajouter bouton de fermeture complete
        run: python3 EssenceLanaudiere/build_tools/patch_shutdown.py
      - name: Verifier les fonctions demandees
        shell: bash
        run: |
          set -euo pipefail
          FILE="EssenceLanaudiere/app/src/main/java/quebec/lanaudiere/essence/MainActivity.java"
          grep -F '60 km' "$FILE"
          grep -F 'VOUS ÊTES ICI' "$FILE"
          grep -F 'CARTE DES STATIONS • ● VOUS' "$FILE"
          grep -F 'loadBrandLogo(brand,x.name)' "$FILE"
          grep -F 'applySafeInsets(page,18,18,18,26)' "$FILE"
          grep -F 'PRIX LE MOINS CHER DANS LA ZONE' "$FILE"
          grep -F 'PRIX LE PLUS ÉLEVÉ DANS LA ZONE' "$FILE"
          grep -F 'BAISSE DE PRIX' "$FILE"
          grep -F 'displayStationAddress(x)' "$FILE"
          grep -F 'rememberStationPrice(x)' "$FILE"
          grep -F 'PRIX MOYENS AUTOUR DU QUÉBEC' "$FILE"
          grep -F 'Ontario ≈ 182,0 ¢/L' "$FILE"
          grep -F 'Vermont ≈ 156,9 ¢CA/L' "$FILE"
          grep -F 'New York ≈ 157,7 ¢CA/L' "$FILE"
          grep -F 'Maine ≈ 154,4 ¢CA/L' "$FILE"
          grep -F 'New Hampshire ≈ 152,4 ¢CA/L' "$FILE"
          grep -F 'N.-B. ≈ 190,3 ¢/L' "$FILE"
          grep -F 'SIMPLE  •  PUISSANTE  •  QUÉBÉCOISE' "$FILE"
          grep -F 'premiumCard()' "$FILE"
          grep -F 'blueBackdrop()' "$FILE"
          grep -F 'MTQ_CAMERA_WFS' "$FILE"
          grep -F 'QUÉBEC 511' "$FILE"
          grep -F 'RADAR_PHOTO_GEOJSON' "$FILE"
          grep -F 'RADAR_ALERT_METERS=1000' "$FILE"
          grep -F 'RADAR PHOTO À PROXIMITÉ' "$FILE"
          grep -F 'radarBlink' "$FILE"
          grep -F 'FOOD_POI_OVERPASS' "$FILE"
          grep -F 'foodPoiJavascript' "$FILE"
          grep -F "McDonald's" "$FILE"
          grep -F 'Tim Hortons' "$FILE"
          grep -F '🍔' "$FILE"
          grep -F '☕' "$FILE"
          if grep -Fq 'markerClusterGroup' "$FILE"; then echo 'ERREUR: regroupement des stations encore present'; exit 1; fi
          grep -F 'NUCLEAR_SHUTDOWN_ARMED' "$FILE"
          grep -F 'startNuclearIconBlink' "$FILE"
          grep -F 'finishAndRemoveTask()' "$FILE"
      - name: Verifier et deployer le logo Essence Quebec
        shell: bash
        run: |
          set -euo pipefail
          RES="EssenceLanaudiere/app/src/main/res"
          LOGO="$RES/drawable/essence_quebec_logo.png"
          echo '3e99fff8892de7c56f773ad5d20fa70f8562c6668b3b60f059d6d114a97e5e98  '"$LOGO" | sha256sum -c -
          file "$LOGO" | grep -F 'PNG image data, 48 x 48'
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "$RES/$d"
            cp "$LOGO" "$RES/$d/ic_launcher.png"
          done
      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compiler APK debug
        run: gradle -p EssenceLanaudiere :app:assembleDebug --stacktrace
      - name: Verifier APK et logo embarque
        shell: bash
        run: |
          set -euo pipefail
          APK="EssenceLanaudiere/app/build/outputs/apk/debug/app-debug.apk"
          unzip -t "$APK" >/dev/null
          unzip -p "$APK" res/drawable/essence_quebec_logo.png > /tmp/logo-apk.png
          echo '3e99fff8892de7c56f773ad5d20fa70f8562c6668b3b60f059d6d114a97e5e98  /tmp/logo-apk.png' | sha256sum -c -
      - name: Renommer APK
        run: cp EssenceLanaudiere/app/build/outputs/apk/debug/app-debug.apk Essence-Quebec.apk
      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: Essence-Lanaudiere-APK
          path: Essence-Quebec.apk
          retention-days: 30
